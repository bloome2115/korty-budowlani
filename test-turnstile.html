<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Test Turnstile — plik tymczasowy</title>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 60px auto; padding: 0 20px; }
    textarea { width: 100%; height: 120px; margin-top: 16px; font-family: monospace; font-size: 12px; }
    .status { margin-top: 16px; font-weight: bold; }
  </style>
</head>
<body>
  <h2>Test Turnstile (plik tymczasowy — usuń po teście)</h2>
  <p>Poniżej powinien pojawić się widget Turnstile. Jeśli tryb "Managed" uzna Cię za człowieka bez dodatkowej interakcji, token pojawi się automatycznie poniżej po chwili.</p>

  <div class="cf-turnstile"
       data-sitekey="0x4AAAAAAEKG6HyPaHfevXYf"
       data-callback="onTurnstileSuccess"></div>

  <div class="status" id="status">Czekam na token...</div>
  <textarea id="tokenBox" readonly placeholder="Tutaj pojawi się token do skopiowania"></textarea>

  <script>
    function onTurnstileSuccess(token) {
      document.getElementById('status').textContent = 'Token wygenerowany! Skopiuj go poniżej (ważny tylko przez kilka minut):';
      document.getElementById('tokenBox').value = token;
    }
  </script>
</body>
</html>
